[project]
name = "safecatch"
version = "1.0.4"
authors = [
  { name="Q12", email="qque12euqq@gmail.com" },
]
description = "Lightweight exception handling decorators for Python"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "requests>=2.0"
]